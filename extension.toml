id = "typegpu-inspector"
name = "TypeGPU Inspector"
version = "0.8.3"
schema_version = 1
authors = ["Konrad Reczko"]
description = "Inspect TypeGPU pipelines, resources, memory layouts, and generated WGSL in the editor."
repository = "https://github.com/reczkok/typegpu-inspector"

[language_servers.typegpu-inspector]
name = "TypeGPU Inspector"
# Zed's built-in language names. `.jsx` belongs to Zed's "JavaScript" language
# (path_suffixes = js, jsx, mjs, cjs), so there is no separate "JSX" entry.
languages = ["TypeScript", "TSX", "JavaScript"]

[language_servers.typegpu-inspector.language_ids]
"TypeScript" = "typescript"
"TSX" = "typescriptreact"
"JavaScript" = "javascript"

[context_servers.typegpu-inspector]
