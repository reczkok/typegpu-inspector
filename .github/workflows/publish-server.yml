name: Publish language server package

on:
  push:
    tags:
      - 'server-v*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish language server package
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # corepack must run before setup-node@v5: its default package-manager
      # cache probes for pnpm during node setup.
      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify release tag matches package version
        run: |
          PACKAGE_VERSION="$(node -p "require('./server/package.json').version")"
          RELEASE_VERSION="${GITHUB_REF_NAME#server-v}"
          if [ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match server/package.json version ${PACKAGE_VERSION}."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --dir server check

      - name: Test
        run: pnpm --dir server test

      - name: Build
        run: pnpm --dir server build

      - name: Install Playwright Chromium with system dependencies
        run: pnpm --dir inspector exec playwright install --with-deps chromium

      # The published server launches typegpu-runtime-inspector-mcp at its own
      # version, so this gate is the last place a broken server/inspector
      # handshake can be caught before the package is public.
      - name: End-to-end LSP smoke test
        run: pnpm --dir server test:e2e

      - name: Verify npm package contents
        working-directory: server
        run: npm pack --dry-run

      - name: Publish
        working-directory: server
        run: npm publish --access public
